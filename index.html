<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamilnadu Police Department - Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #eef2f7;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      width: 380px;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .logo {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 23px;
      color: #17365d;
      margin-bottom: 5px;
    }

    .demo {
      color: #c0392b;
      font-weight: bold;
      margin-bottom: 25px;
    }

    label {
      display: block;
      text-align: left;
      margin: 12px 0 6px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #17365d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0f2744;
    }

    .notice {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">👮</div>

    <h1>Tamilnadu Police Department</h1>

    <div class="demo">
      DEMO / TRAINING PAGE
    </div>

    <form onsubmit="demoLogin(event)">

      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        placeholder="Enter username"
        autocomplete="off"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="off"
        required
      >

      <button type="submit">Login</button>

    </form>

    <div class="notice">
      This is a fictional demonstration interface.
      Do not enter real credentials.
    </div>

  </div>

  <script>
    function demoLogin(event) {
      event.preventDefault();

      alert("Demo login only — no credentials were collected.");
    }
  </script>

</body>
</html>
